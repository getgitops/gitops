<!doctype html>
<html lang="{{ lang }}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ subject }}</title>
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      background-color: #f4f5f7;
      font-family:
        -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      color: #1f2933;
    "
  >
    <table
      role="presentation"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      style="background-color: #f4f5f7; padding: 32px 16px"
    >
      <tr>
        <td align="center">
          <table
            role="presentation"
            width="100%"
            cellpadding="0"
            cellspacing="0"
            style="
              max-width: 600px;
              background-color: #ffffff;
              border-radius: 12px;
              overflow: hidden;
              border: 1px solid #e4e7eb;
            "
          >
            <tr>
              <td style="padding: 20px 32px; border-bottom: 1px solid #e4e7eb">
                <table role="presentation" cellpadding="0" cellspacing="0">
                  <tr>
                    <td
                      style="
                        width: 28px;
                        height: 28px;
                        border-radius: 8px;
                        background-color: #111827;
                        color: #ffffff;
                        font-size: 14px;
                        font-weight: 700;
                        text-align: center;
                        vertical-align: middle;
                      "
                    >
                      G
                    </td>
                    <td
                      style="
                        padding-left: 10px;
                        font-size: 14px;
                        font-weight: 600;
                        letter-spacing: 0.08em;
                        text-transform: uppercase;
                        color: #6b7280;
                      "
                    >
                      {{ productName }}
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
            <tr>
              <td style="padding: 24px 32px 24px 32px">{{{ content }}}</td>
            </tr>
            <tr>
              <td
                style="
                  padding: 16px 32px;
                  background-color: #f9fafb;
                  border-top: 1px solid #e4e7eb;
                  font-size: 12px;
                  line-height: 1.6;
                  color: #9ca3af;
                "
              >
                {{ footer }} {{{ footerLink }}}
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
