<p
  style="
    margin: 0 0 4px 0;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: #ea580c;
  "
>
  {{ eventLabel }}
</p>
<h1 style="margin: 0 0 12px 0; font-size: 22px; line-height: 1.3; color: #111827">{{ title }}</h1>
<p style="margin: 0 0 16px 0; font-size: 15px; line-height: 1.6; color: #374151">{{ intro }}</p>
<table
  role="presentation"
  cellpadding="0"
  cellspacing="0"
  style="width: 100%; margin: 0 0 16px 0; font-size: 14px; color: #374151"
>
  <tr>
    <td style="padding: 4px 12px 4px 0; color: #6b7280; width: 35%">{{ serviceLabel }}</td>
    <td style="padding: 4px 0; font-weight: 600">{{ service }}</td>
  </tr>
  <tr>
    <td style="padding: 4px 12px 4px 0; color: #6b7280">{{ toolLabel }}</td>
    <td style="padding: 4px 0">{{ tool }}</td>
  </tr>
  <tr>
    <td style="padding: 4px 12px 4px 0; color: #6b7280">{{ branchLabel }}</td>
    <td style="padding: 4px 0">{{ branch }}</td>
  </tr>
  <tr>
    <td style="padding: 4px 12px 4px 0; color: #6b7280">{{ commitLabel }}</td>
    <td style="padding: 4px 0; font-family: monospace">{{ commit }}</td>
  </tr>
</table>
{{{ severityTable }}} {{{ errorBlock }}} {{{ policiesBlock }}} {{{ suppressedNote }}} {{{
actionButton }}}
