name: Code Report

on:
  push:
    branches: [development]
  pull_request:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3

      - name: Install dependencies
        run: bun install

      - name: Install GitOps CLI
        run: bun install --global @getgitops/cli@1.2.1

      - name: Run Code Report scan
        env:
          API_URL: https://cloud.getgitops.com/api
          API_KEY: ${{ secrets.GITOPS_API_KEY }}
        run: >-
          gops creport scan
          --api-url "$API_URL"
          --api-key "$API_KEY"
          --service gitops
          --project gitops
          --git-branch "${GITHUB_REF_NAME}"
          --git-repo-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          --git-author "${GITHUB_ACTOR}"
          --git-version "${GITHUB_REF}"
          --git-commit "${GITHUB_SHA}"
          --tags github-actions ci