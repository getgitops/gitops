name: GitDB Release (Changesets)

on:
  push:
    branches:
      - develop
    paths:
      - 'packages/gitdb/**'
      - '.github/workflows/gitdb-release-changesets.yml'

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Version and publish @kettu/gitdb
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        working-directory: packages/gitdb
        run: npm ci

      - name: Create release PR or publish
        uses: changesets/action@v2
        with:
          cwd: packages/gitdb
          version-script: npm run version-packages
          publish-script: npm run release
          commit-message: 'chore(gitdb): version package'
          pr-title: 'chore(gitdb): version package'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
